<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
        }

        .container {
            max-width: 420px;
            margin: 90px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #174a8b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2878e8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2878e8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>👨‍🏫 Teacher Login</h1>

        <p class="subtitle">
            Login to manage student doubts and revision.
        </p>

        <form action="/teacher-dashboard">

            <label>Teacher ID / Email</label>
            <input type="text" placeholder="Enter Teacher ID or Email">

            <label>Password</label>
            <input type="password" placeholder="Enter Password">

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>
</html>
