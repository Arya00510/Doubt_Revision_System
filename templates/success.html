<!DOCTYPE html>
<html>
<head>
    <title>Doubt Submitted</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .success-box {
            background: white;
            padding: 45px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            width: 450px;
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            color: #174a8b;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #2878e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background: #1765cc;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="icon">✅</div>

        <h1>Doubt Submitted Successfully!</h1>

        <p>
            Your doubt has been submitted successfully.
            Your teacher will review it and include it in the revision session if required.
        </p>

        <a href="/student-dashboard" class="btn">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
